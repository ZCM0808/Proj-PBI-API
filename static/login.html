<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Power BI API Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #8b5cf6;
            --accent-hover: #a78bfa;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: float 10s infinite alternate ease-in-out;
        }
        .blob-1 {
            top: -10%; left: -10%;
            width: 500px; height: 500px;
            background: #4c1d95;
            border-radius: 50%;
        }
        .blob-2 {
            bottom: -20%; right: -10%;
            width: 600px; height: 600px;
            background: #1e3a8a;
            border-radius: 50%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 36px 32px 32px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            margin-bottom: 12px;
            box-shadow: inset 0 0 0 1px var(--glass-border);
        }

        .logo svg {
            width: 28px;
            height: 28px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 4px;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.82rem;
        }

        /* Modern Segmented Control Tabs */
        .tab-switcher {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 3px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .tab-btn {
            flex: 1;
            padding: 9px 12px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            user-select: none;
        }

        .tab-btn.active {
            background: rgba(139, 92, 246, 0.25);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2), inset 0 0 0 1px rgba(139, 92, 246, 0.4);
            font-weight: 600;
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Info Badge */
        .info-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .info-badge.pwd {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #93c5fd;
        }
        .info-badge.mfa {
            background: rgba(139, 92, 246, 0.08);
            border: 1px solid rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="password"]:focus,
        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
            background: rgba(0, 0, 0, 0.35);
        }

        #mfa-code {
            font-size: 1.5rem;
            letter-spacing: 0.35em;
            text-align: center;
            font-weight: 600;
            padding: 12px;
        }

        button.btn-submit {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -4px rgba(139, 92, 246, 0.4);
        }

        button.btn-submit:active {
            transform: translateY(0) scale(0.98);
        }

        .error-message {
            color: #ef4444;
            font-size: 0.82rem;
            margin-top: 10px;
            text-align: center;
            min-height: 18px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-message.visible {
            opacity: 1;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .tab-panel {
            display: none;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .tab-panel.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-container">
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="12" width="5" height="9" fill="#F2C811"/>
                    <rect x="9" y="7" width="5" height="14" fill="#F2C811"/>
                    <rect x="15" y="2" width="5" height="19" fill="#F2C811"/>
                </svg>
            </div>
            <h1>Power BI API Explorer</h1>
            <p class="subtitle" id="page-subtitle">选择登录通道进入系统</p>
        </div>

        <!-- Mode Selector Tabs -->
        <div class="tab-switcher">
            <button type="button" class="tab-btn active" id="tab-btn-pwd">
                🔑 密码一登录
            </button>
            <button type="button" class="tab-btn" id="tab-btn-mfa">
                🛡️ MFA 动态口令
            </button>
        </div>

        <!-- Panel 1: Password 1 Login Mode -->
        <div class="tab-panel active" id="panel-pwd">
            <div class="info-badge pwd">
                <span>每天限 <strong>1 次</strong>，单次使用上限 <strong>1 小时</strong></span>
            </div>
            <div class="input-group">
                <label for="password">Access Password (主密码)</label>
                <input type="password" id="password" name="password" placeholder="••••••••" autofocus autocomplete="current-password">
            </div>
            <button type="button" class="btn-submit" id="btn-pwd-login">
                <span class="btn-text">使用密码登录</span>
                <div class="spinner"></div>
            </button>
            <div class="error-message" id="error-pwd"></div>
        </div>

        <!-- Panel 2: MFA Code Independent Login Mode -->
        <div class="tab-panel" id="panel-mfa">
            <div class="info-badge mfa">
                <span><strong>不限次数</strong>，单次使用上限 <strong>3 小时</strong></span>
            </div>
            <div class="input-group">
                <label for="mfa-code">6 位 MFA 动态验证码</label>
                <input type="text" id="mfa-code" name="mfa-code" placeholder="000000" maxlength="6" autocomplete="one-time-code" inputmode="numeric">
            </div>
            <button type="button" class="btn-submit" id="btn-mfa-login">
                <span class="btn-text">使用 MFA 登录</span>
                <div class="spinner"></div>
            </button>
            <div class="error-message" id="error-mfa"></div>
        </div>
    </div>

    <!-- Cinematic Fade Overlay -->
    <div id="fade-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0d1117; opacity: 0; pointer-events: none; z-index: 9999; transition: opacity 0.7s ease;"></div>

    <script>
        // ===== Tab Switching =====
        const tabBtnPwd = document.getElementById('tab-btn-pwd');
        const tabBtnMfa = document.getElementById('tab-btn-mfa');
        const panelPwd = document.getElementById('panel-pwd');
        const panelMfa = document.getElementById('panel-mfa');

        tabBtnPwd.addEventListener('click', () => {
            tabBtnPwd.classList.add('active');
            tabBtnMfa.classList.remove('active');
            panelPwd.classList.add('active');
            panelMfa.classList.remove('active');
            document.getElementById('page-subtitle').textContent = '通道一 • 主密码登录 (每天限1次/1小时)';
            setTimeout(() => document.getElementById('password').focus(), 100);
        });

        tabBtnMfa.addEventListener('click', () => {
            tabBtnMfa.classList.add('active');
            tabBtnPwd.classList.remove('active');
            panelMfa.classList.add('active');
            panelPwd.classList.remove('active');
            document.getElementById('page-subtitle').textContent = '通道二 • MFA 动态口令 (不限次数/3小时)';
            setTimeout(() => document.getElementById('mfa-code').focus(), 100);
        });

        // ===== Pathway 1: Password 1 Login =====
        async function submitPassword1() {
            const password = document.getElementById('password').value.trim();
            if (!password) return;

            const btn = document.getElementById('btn-pwd-login');
            const btnText = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.spinner');
            const errorMsg = document.getElementById('error-pwd');
            errorMsg.classList.remove('visible');
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();

                if (data.success) {
                    loginSuccess(btn, btnText, spinner);
                } else {
                    throw new Error(data.message || 'Authentication failed');
                }
            } catch (err) {
                errorMsg.textContent = err.message || 'Network error. Please try again.';
                errorMsg.classList.add('visible');
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.style.display = 'block';
                document.getElementById('password').focus();
                shakeContainer();
            }
        }

        // ===== Pathway 2: MFA Independent Code Login =====
        async function submitMfaCode() {
            const mfaCode = document.getElementById('mfa-code').value.trim();
            if (!mfaCode) return;

            const btn = document.getElementById('btn-mfa-login');
            const btnText = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.spinner');
            const errorMsg = document.getElementById('error-mfa');
            errorMsg.classList.remove('visible');
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mfa_code: mfaCode })
                });
                const data = await res.json();

                if (data.success) {
                    loginSuccess(btn, btnText, spinner);
                } else {
                    throw new Error(data.message || 'Invalid MFA code');
                }
            } catch (err) {
                errorMsg.textContent = err.message || 'Network error. Please try again.';
                errorMsg.classList.add('visible');
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.style.display = 'block';
                document.getElementById('mfa-code').value = '';
                document.getElementById('mfa-code').focus();
                shakeContainer();
            }
        }

        // ===== Success animation =====
        function loginSuccess(btn, btnText, spinner) {
            btn.style.background = 'var(--accent)';
            spinner.style.display = 'none';
            btnText.style.display = 'block';
            btnText.textContent = 'Success!';

            const container = document.querySelector('.login-container');
            container.style.animation = 'zoomOutFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards';
            document.querySelectorAll('.blob').forEach(blob => {
                blob.style.animation = 'zoomOutFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards';
            });
            document.getElementById('fade-overlay').style.opacity = '1';
            setTimeout(() => { window.location.href = '/'; }, 750);
        }

        // ===== Shake animation =====
        function shakeContainer() {
            const container = document.querySelector('.login-container');
            container.style.animation = 'none';
            container.offsetHeight;
            container.style.animation = 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both';
        }

        // ===== Event Listeners =====
        document.getElementById('btn-pwd-login').addEventListener('click', submitPassword1);
        document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitPassword1(); });

        document.getElementById('btn-mfa-login').addEventListener('click', submitMfaCode);
        document.getElementById('mfa-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitMfaCode(); });
        document.getElementById('mfa-code').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
        });

        // Add dynamic keyframes
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                10%, 90% { transform: translate3d(-1px, 0, 0); }
                20%, 80% { transform: translate3d(2px, 0, 0); }
                30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
                40%, 60% { transform: translate3d(4px, 0, 0); }
            }
            @keyframes zoomOutFade {
                from { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
                to { transform: translateY(-40px) scale(0.95); opacity: 0; filter: blur(8px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
