<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Power BI API Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #8b5cf6;
            --accent-hover: #a78bfa;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Elements */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: float 10s infinite alternate ease-in-out;
        }
        .blob-1 {
            top: -10%; left: -10%;
            width: 500px; height: 500px;
            background: #4c1d95;
            border-radius: 50%;
        }
        .blob-2 {
            bottom: -20%; right: -10%;
            width: 600px; height: 600px;
            background: #1e3a8a;
            border-radius: 50%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Glass Login Container */
        .login-container {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: translateY(0);
            opacity: 1;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: inset 0 0 0 1px var(--glass-border);
        }

        .logo svg {
            width: 32px;
            height: 32px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Step indicator */
        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .step-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            transition: background 0.4s ease, transform 0.4s ease;
        }
        .step-dot.active {
            background: var(--accent);
            transform: scale(1.3);
        }
        .step-dot.done {
            background: #10b981;
        }
        .step-line {
            width: 40px; height: 2px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .step-line-fill {
            height: 100%;
            width: 0%;
            background: #10b981;
            transition: width 0.5s ease;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="password"]:focus,
        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        /* MFA code input special style */
        #mfa-code {
            font-size: 1.6rem;
            letter-spacing: 0.4em;
            text-align: center;
            font-weight: 600;
            padding: 16px;
        }

        /* MFA hint badge */
        .mfa-hint {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 0.82rem;
            color: #c4b5fd;
            line-height: 1.5;
        }
        .mfa-hint svg {
            flex-shrink: 0;
            margin-top: 1px;
        }

        button {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -4px rgba(139, 92, 246, 0.4);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            margin-top: 10px;
            font-size: 0.85rem;
            font-weight: 400;
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            transform: translateY(-1px);
            box-shadow: none;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .error-message.visible {
            opacity: 1;
        }
        
        /* Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Step panels */
        .step-panel {
            display: none;
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .step-panel.active {
            display: block;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* QR Code Binding Section */
        .qr-setup-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            width: auto;
            padding: 0;
            margin-bottom: 14px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s;
            font-weight: 400;
        }
        .qr-setup-toggle:hover {
            color: var(--accent-hover);
            background: none;
            transform: none;
            box-shadow: none;
        }
        .qr-setup-toggle svg { transition: transform 0.3s ease; }
        .qr-setup-toggle.open svg { transform: rotate(180deg); }
        .qr-setup-box {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            animation: fadeInUp 0.3s ease;
        }
        .qr-setup-box.open { display: flex; }
        .qr-setup-box img {
            width: 160px;
            height: 160px;
            border-radius: 8px;
            background: #fff;
            padding: 6px;
        }
        .qr-secret {
            font-family: monospace;
            font-size: 0.78rem;
            color: #94a3b8;
            letter-spacing: 0.1em;
            word-break: break-all;
            text-align: center;
        }
        .qr-label {
            font-size: 0.78rem;
            color: #94a3b8;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-container">
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="12" width="5" height="9" fill="#F2C811"/>
                    <rect x="9" y="7" width="5" height="14" fill="#F2C811"/>
                    <rect x="15" y="2" width="5" height="19" fill="#F2C811"/>
                </svg>
            </div>
            <h1>Power BI API Explorer</h1>
            <p class="subtitle" id="page-subtitle">Private Environment • Enter Password</p>
        </div>

        <!-- Step Indicator -->
        <div class="step-indicator" id="step-indicator">
            <div class="step-dot active" id="dot-1"></div>
            <div class="step-line"><div class="step-line-fill" id="line-fill"></div></div>
            <div class="step-dot" id="dot-2"></div>
        </div>

        <!-- Step 1: Password -->
        <div class="step-panel active" id="step-1">
            <div class="input-group">
                <label for="password">Access Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autofocus autocomplete="current-password">
            </div>
            <button type="button" id="btn-step1">
                <span class="btn-text">Continue</span>
                <div class="spinner"></div>
            </button>
            <div class="error-message" id="error-step1"></div>
        </div>

        <!-- Step 2: MFA Code -->
        <div class="step-panel" id="step-2">
            <div class="mfa-hint">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px">
                    <rect x="5" y="11" width="14" height="10" rx="2"/>
                    <path d="M8 11V7a4 4 0 018 0v4"/>
                </svg>
                <span>打开 <strong>Google / Microsoft Authenticator</strong>，输入「PBI API Explorer」的 6 位动态验证码：</span>
            </div>

            <!-- 首次绑定 QR 码区域 -->
            <button type="button" class="qr-setup-toggle" id="qr-toggle">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                首次使用？展开扫码绑定 Authenticator App
            </button>
            <div class="qr-setup-box" id="qr-setup-box">
                <img id="qr-img" src="" alt="MFA QR Code">
                <p class="qr-label">用 Authenticator App 扫描上方二维码完成绑定<br>或手动输入密钥：</p>
                <div class="qr-secret" id="qr-secret"></div>
            </div>

            <div class="input-group">
                <label for="mfa-code">Authenticator Code（6 位动态验证码）</label>
                <input type="text" id="mfa-code" name="mfa-code" placeholder="000000" maxlength="6" autocomplete="one-time-code" inputmode="numeric">
            </div>
            <button type="button" id="btn-step2">
                <span class="btn-text">Unlock Application</span>
                <div class="spinner"></div>
            </button>
            <button type="button" class="btn-back" id="btn-back">← Back to Password</button>
            <div class="error-message" id="error-step2"></div>
        </div>
    </div>

    <!-- Cinematic Fade Overlay -->
    <div id="fade-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0d1117; opacity: 0; pointer-events: none; z-index: 9999; transition: opacity 0.7s ease;"></div>

    <script>
        // ===== Shared state =====
        let savedPassword = '';

        // ===== Step 1: Password Submit =====
        async function submitPassword() {
            const password = document.getElementById('password').value.trim();
            if (!password) return;

            const btn = document.getElementById('btn-step1');
            const btnText = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.spinner');
            const errorMsg = document.getElementById('error-step1');
            errorMsg.classList.remove('visible');
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();

                if (data.success) {
                    // MFA disabled, direct login success
                    loginSuccess(btn, btnText, spinner);
                } else if (data.mfa_required) {
                    // MFA enabled: inject QR code and go to step 2
                    savedPassword = password;
                    if (data.qr_image_base64) {
                        document.getElementById('qr-img').src = 'data:image/png;base64,' + data.qr_image_base64;
                        document.getElementById('qr-secret').textContent = data.secret || '';
                    }
                    // 已绑定过则隐藏 QR 码入口
                    const qrToggle = document.getElementById('qr-toggle');
                    if (localStorage.getItem('mfa_bound')) {
                        qrToggle.style.display = 'none';
                    } else {
                        qrToggle.style.display = 'flex';
                    }
                    goToStep2();
                    btn.disabled = false;
                    btnText.style.display = 'block';
                    spinner.style.display = 'none';
                } else {
                    throw new Error(data.message || 'Authentication failed');
                }
            } catch (err) {
                errorMsg.textContent = err.message || 'Network error. Please try again.';
                errorMsg.classList.add('visible');
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.style.display = 'block';
                document.getElementById('password').focus();
                shakeContainer();
            }
        }

        // ===== Step 2: MFA Code Submit =====
        async function submitMfaCode() {
            const mfaCode = document.getElementById('mfa-code').value.trim();
            if (!mfaCode) return;

            const btn = document.getElementById('btn-step2');
            const btnText = btn.querySelector('.btn-text');
            const spinner = btn.querySelector('.spinner');
            const errorMsg = document.getElementById('error-step2');
            errorMsg.classList.remove('visible');
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: savedPassword, mfa_code: mfaCode })
                });
                const data = await res.json();

                if (data.success) {
                    loginSuccess(btn, btnText, spinner);
                } else {
                    throw new Error(data.message || 'Invalid code');
                }
            } catch (err) {
                errorMsg.textContent = err.message || 'Network error. Please try again.';
                errorMsg.classList.add('visible');
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.style.display = 'block';
                document.getElementById('mfa-code').value = '';
                document.getElementById('mfa-code').focus();
                shakeContainer();
            }
        }

        // ===== Step navigation =====
        function goToStep2() {
            document.getElementById('step-1').classList.remove('active');
            document.getElementById('step-2').classList.add('active');
            document.getElementById('dot-1').classList.remove('active');
            document.getElementById('dot-1').classList.add('done');
            document.getElementById('dot-2').classList.add('active');
            document.getElementById('line-fill').style.width = '100%';
            document.getElementById('page-subtitle').textContent = 'Step 2 of 2 • Authenticator Verification';
            setTimeout(() => document.getElementById('mfa-code').focus(), 100);
        }

        function goToStep1() {
            document.getElementById('step-2').classList.remove('active');
            document.getElementById('step-1').classList.add('active');
            document.getElementById('dot-2').classList.remove('active');
            document.getElementById('dot-1').classList.remove('done');
            document.getElementById('dot-1').classList.add('active');
            document.getElementById('line-fill').style.width = '0%';
            document.getElementById('page-subtitle').textContent = 'Private Environment • Enter Password';
            document.getElementById('mfa-code').value = '';
            document.getElementById('error-step2').classList.remove('visible');
            setTimeout(() => document.getElementById('password').focus(), 100);
        }

        // ===== Success animation =====
        function loginSuccess(btn, btnText, spinner) {
            // 标记此浏览器已完成 MFA 绑定
            localStorage.setItem('mfa_bound', '1');
            btn.style.background = '#10b981';
            spinner.style.display = 'none';
            btnText.style.display = 'block';
            btnText.textContent = 'Success!';

            const container = document.querySelector('.login-container');
            container.style.animation = 'zoomOutFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards';
            document.querySelectorAll('.blob').forEach(blob => {
                blob.style.animation = 'zoomOutFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards';
            });
            document.getElementById('fade-overlay').style.opacity = '1';
            setTimeout(() => { window.location.href = '/'; }, 750);
        }

        // ===== Shake animation =====
        function shakeContainer() {
            const container = document.querySelector('.login-container');
            container.style.animation = 'none';
            container.offsetHeight;
            container.style.animation = 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both';
        }

        // ===== Event listeners =====
        document.getElementById('btn-step1').addEventListener('click', submitPassword);
        document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitPassword(); });

        document.getElementById('btn-step2').addEventListener('click', submitMfaCode);
        document.getElementById('mfa-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitMfaCode(); });
        document.getElementById('mfa-code').addEventListener('input', (e) => {
            // 只允许数字
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
        });

        document.getElementById('btn-back').addEventListener('click', goToStep1);

        // QR 码绑定区块展开/折叠
        document.getElementById('qr-toggle').addEventListener('click', () => {
            const box = document.getElementById('qr-setup-box');
            const btn = document.getElementById('qr-toggle');
            box.classList.toggle('open');
            btn.classList.toggle('open');
        });

        // Add dynamic keyframes
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                10%, 90% { transform: translate3d(-1px, 0, 0); }
                20%, 80% { transform: translate3d(2px, 0, 0); }
                30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
                40%, 60% { transform: translate3d(4px, 0, 0); }
            }
            @keyframes zoomOutFade {
                from { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
                to { transform: translateY(-40px) scale(0.95); opacity: 0; filter: blur(8px); }
            }
            @keyframes fadeOutBg {
                to { opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Hide step indicator if single-step (MFA disabled)
        // Will be shown/hidden dynamically based on backend response
    </script>
</body>
</html>
